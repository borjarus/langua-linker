[workspace]
members = [
    "crates/anki",
    "crates/application",
    "crates/content",
    "crates/contracts",
    "crates/domain",
    "crates/interop",
    "crates/infrastructure",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# IANA zones for the study day (plan Phase 9 step 11, ADR-15).
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
proptest = { version = "1.6.0", default-features = false, features = ["std"] }
# Bundled SQLite 3.x with FTS5 and JSON1, identical on every platform (plan step 19).
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "1.0.219", features = ["derive"] }
# float_roundtrip: f64 values (FSRS memory states in review-log snapshots) read back bit-exact,
# so an undo restores the card exactly (found by the Phase 16 state-machine fuzz test).
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
tracing = "=0.1.44"
# NFC normalization shared by the domain, the importer and the content linter (plan §14.1).
unicode-normalization = "0.1.24"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
# The bundled content archive is decrypted with 2^19 SHA-256 rounds; unoptimised that takes
# seconds in debug builds and tests.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.lzma-rust2]
opt-level = 3
# llama.cpp on phone needs compiler optimisations (NEON/dotprod); Debug (-O0) is 10x slower
[profile.dev.package.llama-cpp-2]
opt-level = 3
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
[profile.dev.package.langualinker-infrastructure]
opt-level = 3

