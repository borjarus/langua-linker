[workspace]
members = [
    "crates/application",
    "crates/contracts",
    "crates/domain",
    "crates/infrastructure",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"