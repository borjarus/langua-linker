name: Release

# Builds installable release-variant packages for every desktop platform and Android.
# - Pushing a tag `vX.Y.Z` (must match `version` in src-tauri/tauri.conf.json) publishes a GitHub
#   Release with all packages attached; a tag with a suffix (`v0.2.0-beta.1`) is a pre-release.
# - Manual runs only upload the packages as workflow artifacts.
# Signing secrets stay outside the repository (plan Phase 1 step 14). Android release signing:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Desktop packages are unsigned until D-01 decides on code signing/notarization.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            bundles: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          # 22.04 keeps the glibc floor low so the AppImage/deb run on older distributions.
          - name: linux
            os: ubuntu-22.04
            args: ''
            bundles: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'linux'
        name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - if: matrix.name == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run variant -- release build ${{ matrix.args }}
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: langualinker-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The default package list includes the legacy `tools` package, which current cmdline-tools no longer ship.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK r27 (LTS)
        run: sdkmanager --install "ndk;27.3.13750724" "platforms;android-34" "build-tools;34.0.0"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the runner's debug key (testing only, not upgradable)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      # Universal APK (all ABIs) for sideloading; Gradle picks up the signing env (app/build.gradle.kts).
      - run: npm run variant -- release android build --apk
        working-directory: frontend
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APK after the version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-android
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk "dist-android/LanguaLinker_${version}_android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: langualinker-android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: langualinker-*
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
