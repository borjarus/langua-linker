name: Mobile builds

# Milestone builds only (plan Phase 1 step 14); not part of every PR.
on:
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK r27 (LTS)
        run: sdkmanager --install "ndk;27.3.13750724" "platforms;android-34" "build-tools;34.0.0"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Dev variant (com.mila.langualinker.dev, demo frontend); see frontend/scripts/tauri-variant.mjs.
      - run: npm run android:apk
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 14

  # iOS: enable after `tauri ios init` has been run on a Mac and src-tauri/gen/apple is committed.
