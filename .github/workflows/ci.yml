name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run lint:i18n
      - run: npm test
      - run: npm run build
      # Release profile must not contain the demo adapter, fixtures or the debug gallery.
      - run: npm run verify:release
      - run: npm audit --audit-level=high

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # Toolchain version and components come from rust-toolchain.toml.
      - run: rustup show active-toolchain
      # Reused KMP assets and bundled content must match their reviewed checksums.
      - run: node scripts/verify-fixtures.mjs
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! embeds frontendDist at compile time; the frontend job builds the real one.
      - run: mkdir -p frontend/dist && echo '<!doctype html><title>ci</title>' > frontend/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
