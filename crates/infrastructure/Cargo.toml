[package]
name = "langualinker-infrastructure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# llama.cpp engine of the on-device association model (ADR-23); enabled by the mobile builds.
on-device = ["dep:llama-cpp-2"]

[dependencies]
chrono.workspace = true
getrandom = "0.3.4"
keyring-core = "=1.0.1"
langualinker-application = { path = "../application" }
langualinker-domain = { path = "../domain" }
# CSV and the Anki .apkg writer (Phase 14).
langualinker-interop = { path = "../interop" }
# AI provider client (Phase 13, ADR-18): rustls with ring and the Mozilla root store, so no
# platform verifier has to be initialised over JNI on Android and no CMake/NASM is needed.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
tokio = { version = "1.53", default-features = false, features = ["rt", "time", "macros", "net", "io-util"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

# On-device association model (ADR-23): llama.cpp, built from source with CMake and bindgen
# (needs CMake and libclang; on Android the NDK under ANDROID_HOME). Only with `on-device`.
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }

# Native secret stores (ADR-07); see src/secrets.rs.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
# libc++ linked statically, so the APK needs no libc++_shared.so.
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["android-static-stdcxx"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
chrono.workspace = true
langualinker-anki = { path = "../anki" }
langualinker-content = { path = "../content" }
# Property-based fuzzing of parsers, archives and the study state machine (Phase 16).
proptest.workspace = true
# SQL functions let the data-loss drill abort inside a migration transaction (Phase 16).
rusqlite = { workspace = true, features = ["functions"] }
tempfile = "3.23.0"

[[bench]]
name = "due_query"
harness = false
