[package]
name = "langualinker-infrastructure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
getrandom = "0.3.4"
keyring-core = "=1.0.1"
langualinker-application = { path = "../application" }
langualinker-domain = { path = "../domain" }
rusqlite.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

# Native secret stores (ADR-07); see src/secrets.rs.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["protected"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
chrono.workspace = true
langualinker-anki = { path = "../anki" }
langualinker-content = { path = "../content" }
tempfile = "3.23.0"

[[bench]]
name = "due_query"
harness = false
