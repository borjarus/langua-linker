[package]
name = "langualinker-interop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CSV and Anki (schema 11 .apkg) interoperability: parsing, the card codec and the writer (plan Phase 14)"

[dependencies]
langualinker-domain = { path = "../domain" }
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
# Anki's note checksum (`notes.csum`) is the first 32 bits of the SHA-1 of the sort field.
sha1 = { version = "0.10.6", optional = true }
thiserror.workspace = true
# .apkg is a ZIP; deflate through the pure-Rust zlib-rs (no C toolchain on the phones).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[features]
default = ["apkg"]
# The .apkg writer (SQLite + ZIP). The application layer uses the CSV code and the codec only.
apkg = ["dep:rusqlite", "dep:sha1", "dep:zip"]

[dev-dependencies]
proptest.workspace = true
tempfile = "3.23.0"
