[package]
name = "langualinker"
version = "0.3.0-beta.2"
description = "LanguaLinker Tauri shell"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Mobile targets load the app as a library; the name differs from the binary to avoid
# output collisions on Windows.
[lib]
name = "langualinker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
chrono.workspace = true
# Device time zone for the first study-day calendar (Phase 12).
iana-time-zone = "0.1.65"
langualinker-application = { path = "../crates/application" }
langualinker-content = { path = "../crates/content" }
langualinker-contracts = { path = "../crates/contracts" }
langualinker-domain = { path = "../crates/domain" }
langualinker-infrastructure = { path = "../crates/infrastructure" }
serde_json.workspace = true
tracing.workspace = true
serde.workspace = true
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-fs = "=2.6.0"
tauri-plugin-notification = "=2.5.1"

[dev-dependencies]
keyring-core = "=1.0.1"
tauri = { version = "=2.12.2", features = ["test"] }
